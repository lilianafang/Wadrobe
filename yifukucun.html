column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);padding:12px;border-radius:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.preview{min-height:180px;background:#f5f1eb;border:1px dashed #d8d0c6;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:auto;color:var(--muted);gap:8px;padding:8px;flex-wrap:wrap}.preview img{width:100px;height:120px;object-fit:cover;border-radius:10px;flex-shrink:0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px}.detail-colors{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.detailphoto{height:480px;background:#f1ede6;border-radius:18px;overflow:hidden;position:relative}.photo-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}.photo-track::-webkit-scrollbar{display:none}.detail-slide{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:start}.detail-slide img{width:100%;height:100%;object-fit:cover}.detailphoto .emoji{font-size:130px}.photo-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#fffdfdcc;color:#60452f;font-size:22px;z-index:2}.photo-prev{left:12px}.photo-next{right:12px}.photo-count{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#241a1290;color:#fff;border-radius:99px;padding:5px 10px;font-size:12px;z-index:2}.detailcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px}.detailcard h2{margin-top:0}.rows{display:grid;gap:13px;margin:20px 0}.row{display:flex}.row span:first-child{color:var(--muted);width:100px;flex-shrink:0}.row span:last-child{font-weight:600}.profit-row{color:var(--green)}.colors-panel{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.colors-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.colors-head h3{margin:0}.color-list{display:grid;gap:10px}.color-row{display:flex;align-items:center;gap:10px;background:#faf7f2;border:1px solid var(--line);padding:10px;border-radius:12px}.color-swatch{width:34px;height:34px;border-radius:9px;border:1px solid #d8d0c6;flex-shrink:0}.color-info{flex:1;min-width:0}.color-name{font-weight:700}.color-hex{font-size:11px;color:var(--muted);margin-top:2px}.stock-control{display:flex;align-items:center;gap:5px}.stock-control input{width:62px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;text-align:center}.color-delete{border:0;background:#eee5dc;border-radius:8px;width:32px;height:32px;color:#806b5a}.add-color-box{display:none;background:#f8f4ee;border:1px dashed #d8d0c6;border-radius:13px;padding:14px;margin-top:10px}.add-color-box.show{display:block}.color-form{display:grid;grid-template-columns:55px 1fr 100px auto;gap:8px;align-items:center}.color-form input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px}.color-form input[type=color]{width:55px;height:42px;padding:3px}.hint{font-size:11px;color:var(--muted);margin-top:8px}.modal{position:fixed;inset:0;background:#241a1290;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{background:#fffdf9;border-radius:20px;width:min(650px,100%);padding:25px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0}.sale-summary{background:#f7f2eb;border-radius:13px;padding:14px;margin-bottom:15px}.sale-total{font-size:22px;font-weight:800;color:var(--brown);margin-top:12px}.sales-list{display:grid;gap:10px}.sale-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;align-items:center;gap:15px}.sale-main{flex:1}.sale-name{font-weight:700}.sale-meta{font-size:12px;color:var(--muted);margin-top:5px}.sale-money{font-weight:800;color:var(--brown)}.sale-empty{text-align:center;color:var(--muted);padding:50px}.datebox{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.drive-status{font-size:12px;margin-top:8px;color:var(--muted)}.drive-ok{color:var(--green);font-weight:700}.drive-login{margin-top:12px}
@media(max-width:900px){.sidebar{width:75px;padding:20px 8px}.logo{font-size:0}.logo:after{content:"衣";font-size:24px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:20px}.main{padding:22px}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.app{display:block}.sidebar{position:fixed;bottom:0;top:auto;width:100%;height:66px;z-index:4;border:0;border-top:1px solid var(--line);padding:6px}.logo{display:none}.nav{display:flex;justify-content:space-around}.nav button{font-size:12px!important;padding:8px}.main{padding:18px 14px 85px}.top{gap:10px}.top h1{font-size:23px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.photo{height:155px}.toolbar{flex-wrap:wrap}.toolbar .search{flex-basis:100%}.toolbar select{flex:1;min-height:42px}.formgrid,.detail,.analytics{grid-template-columns:1fr}.detail-colors{grid-column:auto}.detailphoto{height:360px}.color-form{grid-template-columns:50px 1fr 80px}.color-form button{grid-column:1/-1}.color-row{align-items:flex-start}.stock-control{flex-direction:column;align-items:flex-end}.sale-card{align-items:flex-start;flex-wrap:wrap}.sale-money{width:100%;text-align:right}}

<body>
<div class="app">
<aside class="sidebar"><div class="logo">衣橱管家</div><div class="nav"><button class="active" data-page="home">⌂ 首页</button><button data-page="categories">▦ 分类</button><button data-page="stats">▥ 统计</button><button data-page="sales">¥ 销售</button><button data-page="about">○ 我的</button></div></aside>
<main class="main">

<section id="home" class="page active">
<div class="top"><div><h1>衣服库存</h1><div class="sub">管理你的衣橱，清楚知道每一件衣服在哪里</div></div><div class="actions"><button class="iconbtn" onclick="focusSearch()">⌕</button><button class="primary" onclick="openAdd()">＋ 添加衣服</button></div></div>
<div class="stats"><div class="stat"><small>总库存</small><b id="sTotal">0</b></div><div class="stat"><small>上衣</small><b id="sTop">0</b></div><div class="stat"><small>下装</small><b id="sBottom">0</b></div><div class="stat"><small>其他</small><b id="sOther">0</b></div></div>
<div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="搜索名称、编码、品牌..." oninput="render()"></div><select id="filter" onchange="updateSubFilter();render()"></select><select id="subFilter" onchange="render()"><option value="">全部小分类</option></select></div>
<div id="grid" class="grid"></div>
</section>

<section id="categories" class="page"><div class="top"><div><h1>分类</h1><div class="sub">自定义你的衣橱分类和小分类</div></div><button class="primary" onclick="addCategory()">＋ 添加大分类</button></div><div id="catList" class="category-list"></div></section>

<section id="stats" class="page"><div class="top"><div><h1>统计</h1><div class="sub">了解你的衣橱构成</div></div></div><div class="analytics"><div class="panel"><h3>库存概览</h3><div id="summary"></div></div><div class="panel"><h3>分类数量</h3><div class="bars" id="bars"></div></div></div></section>

<section id="sales" class="page"><div class="top"><div><h1>销售记录</h1><div class="sub">查看指定日期的全部销售单和营业额</div></div></div><div class="panel"><div class="toolbar"><input class="datebox" type="date" id="salesDate" onchange="renderSales()"><button class="iconbtn" onclick="setSalesDate(0)">今天</button><button class="iconbtn" onclick="setSalesDate(-1)">昨天</button></div><div id="salesSummary"></div><div id="salesList" class="sales-list"></div></div></section>

<section id="about" class="page">
<div class="top"><div><h1>我的</h1><div class="sub">衣橱设置</div></div></div>
<div class="panel">
<h3>数据</h3>
<p>衣服资料、分类、颜色库存和销售记录保存在当前浏览器。照片会自动保存到你的 Google Drive。</p>
<div id="driveStatus" class="drive-status">Google Drive：未连接</div>
<div class="drive-login"><button class="primary" onclick="googleLogin()">连接 Google Drive</button></div>
<br>
<button class="iconbtn" onclick="clearAll()">清空全部库存</button> <button class="iconbtn" onclick="resetCategories()">恢复默认分类</button>
</div>
</section>

<section id="detail" class="page"><div class="top"><div><h1>衣服详情</h1></div><button class="iconbtn" onclick="showPage('home')">← 返回</button></div><div id="detailContent"></div></section>

</main></div>

<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">添加衣服</h2><button class="iconbtn" onclick="closeModal()">×</button></div>
<form id="form" class="formgrid">
<input id="editId" type="hidden">
<div class="field full"><label>照片（可选择多张）</label><div class="preview" id="preview">点击下面选择照片</div><input id="photo" type="file" accept="image/*" multiple onchange="previewPhotos(event)"></div>
<div class="field"><label>名称</label><input id="name" required placeholder="例如：米色风衣"></div>
<div class="field"><label>编码</label><input id="code" placeholder="例如：DR-2026-001"></div>
<div class="field"><label>大分类</label><select id="category" onchange="updateSubcategory()"></select></div>
<div class="field"><label>小分类</label><select id="subcategory"></select></div>
<div class="field"><label>品牌</label><input id="brand" placeholder="ZARA"></div>
<div class="field"><label>购买价格</label><input id="price" type="number" min="0" step="0.01" placeholder="299"></div>
<div class="field"><label>零售价格</label><input id="retailPrice" type="number" min="0" step="0.01" placeholder="399"></div>
<div class="field"><label>购买日期</label><input id="date" type="date"></div>
<div class="field"><label>所在位置</label><input id="location" placeholder="衣柜左侧"></div>
<div class="field full"><label>备注</label><textarea id="note" placeholder="例如：适合春秋穿"></textarea></div>
<div class="field full"><button class="primary" id="saveBtn" type="submit">保存衣服</button></div>
</form></div></div>

<div class="modal" id="saleModal"><div class="modalbox"><div class="modalhead"><h2>确认卖掉</h2><button class="iconbtn" onclick="closeSale()">×</button></div><div id="saleInfo"></div>
<form id="saleForm" class="formgrid">
<input id="saleItemId" type="hidden">
<div class="field"><label>颜色</label><select id="saleColor" onchange="updateSaleStock()"></select></div>
<div class="field"><label>库存</label><input id="saleAvailable" disabled></div>
<div class="field"><label>卖出数量</label><input id="saleQty" type="number" min="1" step="1" value="1" onchange="updateSaleTotal()"></div>
<div class="field"><label>销售单价</label><input id="salePrice" type="number" min="0" step="0.01" placeholder="399" oninput="updateSaleTotal()"></div>
<div class="field"><label>销售日期</label><input id="saleDate" type="date"></div>
<div class="field full"><div class="sale-summary">销售金额：<span id="saleTotal">€0.00</span></div></div>
<div class="field full"><button class="primary" type="submit">确认卖掉</button></div>
</form></div></div>

<script>
const CLIENT_ID="575382709878-r0ivjeb9uf4d46lcoua3735r15ivsqbc.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.file";
const key="wardrobe_inventory_v1",categoryKey="wardrobe_categories_v1",salesKey="wardrobe_sales_v1";
const defaultCats=["上衣","下装","外套","全身","鞋子","包包","配饰","其他"];
const defaultSubcats={"上衣":["衬衫","短袖","卫衣","毛衣","针织衫","背心","吊带","Polo衫","其他"],"下装":["牛仔裤","西裤","休闲裤","短裤","半身裙","运动裤","打底裤","其他"],"外套":["风衣","大衣","羽绒服","夹克","西装","针织开衫","皮衣","其他"],"全身":["长裙","短裙","吊带裙","针织裙","礼服","其他"],"鞋子":["运动鞋","靴子","高跟鞋","平底鞋","凉鞋","拖鞋","其他"],"包包":["托特包","单肩包","斜挎包","手提包","背包","钱包"],"配饰":["帽子","围巾","手套","腰带","首饰","眼镜","其他"],"其他":["家居服","睡衣","泳装","其他"]};
const icons={上衣:"👕",下装:"👖",外套:"🧥",全身:"👗",鞋子:"👟",包包:"👜",配饰:"💍",其他:"◉"};

let categoryData=JSON.parse(localStorage.getItem(categoryKey)||"null");
if(!categoryData)categoryData={cats:[...defaultCats],subcats:JSON.parse(JSON.stringify(defaultSubcats))};
else{
categoryData.cats=(categoryData.cats||[]).map(x=>x==="连衣裙"?"全身":x);
categoryData.subcats=categoryData.subcats||{};
if(categoryData.subcats["连衣裙"]&&!categoryData.subcats["全身"]){categoryData.subcats["全身"]=categoryData.subcats["连衣裙"];delete categoryData.subcats["连衣裙"]}
defaultCats.forEach(c=>{if(!categoryData.subcats[c])categoryData.subcats[c]=defaultSubcats[c]||[]});
if(!categoryData.cats.length)categoryData.cats=[...defaultCats]
}

let cats=categoryData.cats,subcats=categoryData.subcats;
let items=JSON.parse(localStorage.getItem(key)||"null")||[];
let sales=JSON.parse(localStorage.getItem(salesKey)||"null")||[];
let uploadedFiles=[];
let uploadedPreviews=[];
let saleTarget=null;
let accessToken=null;
let tokenClient=null;
let driveReady=false;
let imageCache={};

function normalizeImages(x){
if(Array.isArray(x.images)&&x.images.length)return x.images.filter(Boolean);
if(x.image)return[x.image];
return[]
}

function normalizeColors(x){
if(Array.isArray(x.colors)&&x.colors.length)return x.colors.map(c=>({name:String(c.name||"未命名"),hex:c.hex||"#d8c3a5",stock:Math.max(0,Number(c.stock)||0)}));
if(x.color||x.colorHex)return[{name:x.color||"未命名",hex:x.colorHex||"#d8c3a5",stock:Math.max(1,Number(x.stock)||1)}];
return[{name:"其他",hex:"#d8c3a5",stock:1}]
}

items=items.map(x=>({...x,category:x.category==="连衣裙"?"全身":x.category,code:x.code||"",retailPrice:x.retailPrice||"",subCategory:x.subCategory||"其他",images:normalizeImages(x),colors:normalizeColors(x)}));

const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(key,JSON.stringify(items));
const saveSales=()=>localStorage.setItem(salesKey,JSON.stringify(sales));
const saveCategories=()=>localStorage.setItem(categoryKey,JSON.stringify({cats,subcats}));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=v=>v!==""&&v!=null&&!isNaN(Number(v))?"€"+Number(v).toFixed(2):"";
const totalStock=x=>(x.colors||[]).reduce((s,c)=>s+(Number(c.stock)||0),0);
const colorNames=x=>(x.colors||[]).map(c=>c.name).join("、");
const today=()=>new Date().toISOString().slice(0,10);

function setDriveStatus(text,ok=false){
$("driveStatus").textContent=text;
$("driveStatus").className="drive-status"+(ok?" drive-ok":"");
}

function initGoogle(){
if(!window.google||!google.accounts||!google.accounts.oauth2)return;
tokenClient=google.accounts.oauth2.initTokenClient({
client_id:CLIENT_ID,
scope:DRIVE_SCOPE,
callback:async response=>{
if(response.error){setDriveStatus("Google Drive：连接失败");alert("Google Drive 登录失败");return}
accessToken=response.access_token;
driveReady=true;
setDriveStatus("Google Drive：已连接 ✓",true);
await migrateOldImages();
render();
}
});
}

function googleLogin(){
if(!tokenClient)return alert("Google 登录组件还没有加载完成，请稍等几秒后再试。");
tokenClient.requestAccessToken({prompt:"consent"});
}

async function ensureDrive(){
if(driveReady&&accessToken)return true;
googleLogin();
return false
}

async function uploadToDrive(file){
if(!accessToken)throw new Error("没有 Google Drive 登录权限");
let metadata={name:"衣橱_"+Date.now()+"_"+file.name,mimeType:file.type,description:"衣橱管家图片"};
let form=new FormData();
form.append("metadata",new Blob([JSON.stringify(metadata)],{type:"application/json"}));
form.append("file",file);
let r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType",{
method:"POST",
headers:{Authorization:"Bearer "+accessToken},
body:form
});
if(!r.ok){
let t=await r.text();
throw new Error(t||"Google Drive 上传失败");
}
return await r.json()
}

async function getDriveImage(id){
if(!id)return null;
if(imageCache[id])return imageCache[id];
if(!accessToken)return null;
try{
let r=await fetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(id)+"?alt=media",{
headers:{Authorization:"Bearer "+accessToken}
});
if(r.status===401){
driveReady=false;
accessToken=null;
setDriveStatus("Google Drive：登录已过期，请重新连接");
return null
}
if(!r.ok)return null;
let blob=await r.blob();
let url=URL.createObjectURL(blob);
imageCache[id]=url;
return url
}catch(e){return null}
}

async function deleteDriveFile(id){
if(!id||!accessToken)return;
try{
await fetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(id),{
method:"DELETE",
headers:{Authorization:"Bearer "+accessToken}
})
}catch(e){}
delete imageCache[id]
}

async function migrateOldImages(){
let changed=false;
for(let x of items){
let old=[];
for(let img of x.images||[]){
if(typeof img==="string"&&img.startsWith("data:"))old.push(img)
}
if(!old.length)continue;
if(!accessToken)continue;
try{
let ids=[];
for(let img of x.images||[]){
if(typeof img==="string"&&img.startsWith("data:")){
let blob=await fetch(img).then(r=>r.blob());
let file=new File([blob],"衣橱_"+x.id+"_"+Date.now()+".jpg",{type:blob.type||"image/jpeg"});
let f=await uploadToDrive(file);
ids.push(f.id)
}else if(img)ids.push(img)
}
x.images=ids;
changed=true;
}catch(e){
console.error("旧图片迁移失败",e)
}
}
if(changed)save()
}

}

function card(x){

async function loadCardImages(){

function updateStats(){

}

function renderCats(){
$("catList").innerHTML=cats.map(c=>{
let total=items.filter(x=>x.category===c).reduce((s,x)=>s+totalStock(x),0);

}).join("")
}

function addCategory(){
let c=prompt("请输入新的大分类名称：")?.trim();if(!c)return;
if(cats.includes(c))return alert("这个大分类已经存在");
cats.push(c);subcats[c]=["其他"];saveCategories();updateCategorySelects();render()
}

function addSubCategory(e,c){
e.stopPropagation();let sc=prompt(`给「${c}」添加一个小分类：`)?.trim();if(!sc)return;
subcats[c]??=[];
if(subcats[c].includes(sc))return alert("这个小分类已经存在");
subcats[c].push(sc);saveCategories();updateCategorySelects();render()
}

function deleteSubCategory(e,c,sc){
e.stopPropagation();
let n=items.filter(x=>x.category===c&&x.subCategory===sc).length;
if(!confirm(`确定删除小分类「${sc}」吗？${n?`\n\n${n} 个款式会移动到“其他”。`:""}`))return;
items=items.map(x=>x.category===c&&x.subCategory===sc?{...x,subCategory:"其他"}:x);
subcats[c]=(subcats[c]||[]).filter(x=>x!==sc);
if(!subcats[c].includes("其他"))subcats[c].push("其他");
saveCategories();save();updateCategorySelects();render()
}

function deleteCategory(e,c){
e.stopPropagation();
if(cats.length<=1)return alert("至少需要保留一个大分类");
let n=items.filter(x=>x.category===c).length;
if(!confirm(`确定删除大分类「${c}」吗？${n?`\n\n${n} 个款式会移动到“其他”。`:""}`))return;
items=items.map(x=>x.category===c?{...x,category:"其他",subCategory:"其他"}:x);
cats=cats.filter(x=>x!==c);delete subcats[c];

}

function renderAnalytics(){

async function loadDetailImages(imgs){

for(let i=0;i<imgs.length;i++){

function slidePhoto(dir){

let n=Math.round(t.scrollLeft/t.clientWidth),max=t.children.length-1;

function undoSale(id){
let s=sales.find(x=>x.id===id);if(!s)return;
if(!confirm(`确定撤销这笔销售吗？\n${s.itemName} · ${s.color} · ${s.qty}件 · €${Number(s.total).toFixed(2)}\n撤销后库存会恢复。`))return;
let x=items.find(i=>i.id===s.itemId);
if(x){
let c=x.colors.find(c=>c.name===s.color);
if(c)c.stock+=Number(s.qty)||0;
else x.colors.push({name:s.color,hex:s.colorHex||"#d8c3a5",stock:Number(s.qty)||0});
save()
}
sales=sales.filter(x=>x.id!==id);
saveSales();renderSales();render()
}

$("saleModal").onclick=e=>{if(e.target===$("saleModal"))closeSale()};

updateCategorySelects();
$("salesDate").value=today();
render();

if(window.google&&google.accounts&&google.accounts.oauth2)initGoogle();

window.addEventListener("load",()=>{
setTimeout(()=>{
if(window.google&&google.accounts&&google.accounts.oauth2)initGoogle();
},500)
});
